<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula VR · Práctica docente</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1220; color: #e8eefc;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
      #scene-container { position: fixed; inset: 0; }
      #overlay { position: fixed; left: 0; right: 0; top: 16px; display: flex;
        flex-direction: column; align-items: center; gap: 10px; pointer-events: none; padding: 0 16px; text-align: center; }
      #enter-vr { pointer-events: auto; font-size: 20px; font-weight: 600; padding: 14px 28px;
        border: 0; border-radius: 999px; background: #3b82f6; color: #fff; cursor: pointer; }
      #enter-vr:disabled { background: #475569; cursor: not-allowed; }
      #hint { font-size: 14px; opacity: .8; max-width: 520px; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="overlay">
      <button id="enter-vr" disabled>Comprobando WebXR…</button>
      <div id="hint"></div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
